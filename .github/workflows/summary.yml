name: Summarise latest commit
on: workflow_dispatch
permissions:
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - run: npm install -g @github/copilot
      - run: copilot -p "Summarise the latest commit" -s --no-ask-user --allow-tool='shell(git show:*)'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
